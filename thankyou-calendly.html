<style>
:root{--ink:#05070E;--blue:#3D83F6;--blue-2:#5B9BFF;--paper:#EAF0FB;--muted:#93A4C4;--line:rgba(120,160,235,.14);--line-2:rgba(120,160,235,.22);--glow:rgba(61,131,246,.35);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--paper);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px;overflow-x:hidden;position:relative}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic','Inter',sans-serif}
h1{font-family:'Sora',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05}
[dir=rtl] h1{font-family:'IBM Plex Sans Arabic',sans-serif;letter-spacing:0;line-height:1.4}
a{text-decoration:none}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg::before{content:"";position:absolute;inset:0;background:radial-gradient(60vw 60vw at 78% -8%,rgba(61,131,246,.16),transparent 60%),radial-gradient(50vw 50vw at 8% 12%,rgba(27,73,174,.14),transparent 62%),radial-gradient(70vw 40vw at 50% 118%,rgba(61,131,246,.08),transparent 60%)}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(120vw 120vh at 50% 0,#000,transparent 80%);mask-image:radial-gradient(120vw 120vh at 50% 0,#000,transparent 80%)}
.card{position:relative;z-index:2;width:100%;max-width:560px;text-align:center;padding:52px 44px;border:1px solid var(--line-2);border-radius:26px;background:linear-gradient(180deg,rgba(16,26,48,.55),rgba(6,9,17,.72));backdrop-filter:blur(16px);box-shadow:0 40px 100px -40px rgba(0,0,0,.8)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:26px 26px 0 0;background:linear-gradient(90deg,transparent,var(--blue),var(--blue-2),var(--blue),transparent)}
.logo{height:30px;width:auto;margin:0 auto 34px;display:block}
.ring{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;background:rgba(61,131,246,.12);border:1.5px solid var(--blue);display:grid;place-items:center;color:var(--blue-2);box-shadow:0 0 40px -6px var(--glow);animation:pop .5s var(--ease)}
.ring svg{width:40px;height:40px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
h1{font-size:clamp(30px,5.4vw,44px)}
.sub{color:var(--muted);font-size:18px;line-height:1.65;margin:18px auto 34px;max-width:420px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font-family:'Sora';font-weight:600;font-size:15px;padding:14px 26px;border-radius:100px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;border:1px solid transparent;transition:all .3s var(--ease)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 10px 30px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:hover{background:var(--blue-2);transform:translateY(-2px)}
.btn svg{width:17px;height:17px}
@media(max-width:520px){.card{padding:40px 24px}.sub{font-size:16px}}
@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
